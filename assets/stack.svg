<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="392" viewBox="0 0 1000 392" fill="none">
  <style>
    .mono { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
    @keyframes tw { 0%, 100% { opacity: .8; } 50% { opacity: .25; } }
    .tw { animation: tw 4s ease-in-out infinite; }
  </style>

  <rect width="1000" height="392" fill="#05070c"/>
  <rect x="0.5" y="0.5" width="999" height="391" stroke="#1a2234"/>

  <g fill="#9ec5ff">
    <circle class="tw" cx="930" cy="30" r="0.9"/>
    <circle cx="880" cy="350" r="0.7" opacity="0.35"/>
    <circle class="tw" cx="180" cy="28" r="0.8"/>
    <circle cx="520" cy="24" r="0.6" opacity="0.3"/>
  </g>

  <text x="40" y="40" class="mono" font-size="13" fill="#9ec5ff">$ cat stack.manifest</text>
  <line x1="40" y1="58" x2="960" y2="58" stroke="#1a2234"/>

  <!-- row: languages -->
  <text x="40" y="98" class="mono" font-size="10.5" letter-spacing="1.8" fill="#5c6880">LANGUAGES</text>
  <text x="280" y="98" class="mono" font-size="13" fill="#ccd3e0">JavaScript · TypeScript · Java · Python · PHP · Ruby · Kotlin · Lua</text>
  <line x1="40" y1="118" x2="960" y2="118" stroke="#1a2234"/>

  <!-- row: frameworks -->
  <text x="40" y="152" class="mono" font-size="10.5" letter-spacing="1.8" fill="#5c6880">FRAMEWORKS</text>
  <text x="280" y="148" class="mono" font-size="13" fill="#ccd3e0">Node.js · Express.js · Spring Boot · Laravel · Rails · React</text>
  <text x="280" y="168" class="mono" font-size="13" fill="#ccd3e0">Next.js · React Native · Bun · Elysia · Tailwind CSS</text>
  <line x1="40" y1="188" x2="960" y2="188" stroke="#1a2234"/>

  <!-- row: data -->
  <text x="40" y="222" class="mono" font-size="10.5" letter-spacing="1.8" fill="#5c6880">DATA &amp; MESSAGING</text>
  <text x="280" y="218" class="mono" font-size="13" fill="#ccd3e0">PostgreSQL · MySQL · MongoDB · Redis · SQLite · Firestore</text>
  <text x="280" y="238" class="mono" font-size="13" fill="#ccd3e0">RabbitMQ · Kafka · BullMQ</text>
  <line x1="40" y1="258" x2="960" y2="258" stroke="#1a2234"/>

  <!-- row: infra -->
  <text x="40" y="292" class="mono" font-size="10.5" letter-spacing="1.8" fill="#5c6880">INFRA &amp; DEVOPS</text>
  <text x="280" y="288" class="mono" font-size="13" fill="#ccd3e0">AWS · Docker · Linux · GitHub Actions · Proxmox</text>
  <text x="280" y="308" class="mono" font-size="13" fill="#ccd3e0">Nginx · Apache · Git · CI/CD</text>
  <line x1="40" y1="328" x2="960" y2="328" stroke="#1a2234"/>

  <!-- row: protocols -->
  <text x="40" y="364" class="mono" font-size="10.5" letter-spacing="1.8" fill="#5c6880">PROTOCOLS</text>
  <text x="280" y="364" class="mono" font-size="13" fill="#ccd3e0">REST · GraphQL · gRPC · WebSocket · JWT · OIDC · Microservices</text>
</svg>
