<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" fill="none">
  <style>
    .mono { font-family: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace; }
    .sans { font-family: 'Inter Tight', 'Segoe UI', Arial, sans-serif; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes tw1 { 0%, 100% { opacity: .9; } 50% { opacity: .2; } }
    @keyframes tw2 { 0%, 100% { opacity: .3; } 50% { opacity: .85; } }
    .cursor { animation: blink 1.1s step-end infinite; }
    .tw1 { animation: tw1 3.2s ease-in-out infinite; }
    .tw2 { animation: tw2 4.7s ease-in-out infinite; }
  </style>

  <rect width="1000" height="280" fill="#05070c"/>
  <rect x="0.5" y="0.5" width="999" height="279" stroke="#1a2234"/>

  <!-- stars -->
  <g fill="#9ec5ff">
    <circle class="tw1" cx="860" cy="86" r="1.1"/>
    <circle class="tw2" cx="925" cy="140" r="0.9"/>
    <circle class="tw1" cx="700" cy="70" r="0.8"/>
    <circle class="tw2" cx="640" cy="180" r="1"/>
    <circle cx="795" cy="205" r="0.7" opacity="0.4"/>
    <circle class="tw2" cx="960" cy="60" r="0.8"/>
    <circle cx="540" cy="95" r="0.7" opacity="0.35"/>
    <circle class="tw1" cx="905" cy="230" r="0.9"/>
    <circle cx="300" cy="60" r="0.7" opacity="0.3"/>
    <circle class="tw2" cx="180" cy="215" r="0.9"/>
    <circle cx="470" cy="200" r="0.6" opacity="0.3"/>
    <circle class="tw1" cx="760" cy="120" r="0.7"/>
  </g>

  <!-- nav row -->
  <text x="40" y="42" class="mono" font-size="13" fill="#e8ecf4">~/fabisiak.dev</text>
  <text x="960" y="42" class="mono" font-size="11" letter-spacing="1.5" fill="#5c6880" text-anchor="end">about · stack · experience · projects</text>
  <line x1="40" y1="62" x2="960" y2="62" stroke="#1a2234"/>

  <!-- whoami -->
  <text x="40" y="108" class="mono" font-size="15" fill="#9ec5ff">$ whoami</text>
  <rect class="cursor" x="140" y="96" width="9" height="17" fill="#9ec5ff"/>

  <!-- name -->
  <text x="37" y="170" class="sans" font-size="60" font-weight="300" letter-spacing="-2" fill="#e8ecf4">Eduardo Fabisiak</text>
  <text x="40" y="204" class="sans" font-size="16" fill="#8f9ab0">backend &amp; full-stack software engineer · Rio Grande do Sul, Brazil</text>

  <!-- links -->
  <line x1="40" y1="230" x2="960" y2="230" stroke="#1a2234"/>
  <g class="mono" font-size="12.5">
    <text x="40" y="257" fill="#9ec5ff">$</text>
    <text x="58" y="257" fill="#8f9ab0">github</text>
    <text x="132" y="257" fill="#e8ecf4">github.com/duuuuardo</text>

    <text x="400" y="257" fill="#9ec5ff">$</text>
    <text x="418" y="257" fill="#8f9ab0">linkedin</text>
    <text x="508" y="257" fill="#e8ecf4">/in/eduardofabisiak</text>

    <text x="716" y="257" fill="#9ec5ff">$</text>
    <text x="734" y="257" fill="#8f9ab0">email</text>
    <text x="798" y="257" fill="#e8ecf4">eduardofabisiak@proton.me</text>
  </g>
</svg>
